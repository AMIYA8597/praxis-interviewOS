[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-realtime-agent"
version = "0.1.0"
description = "PRAXIS Realtime Agent"
dependencies = [
    "fastapi",
    "websockets",
    "numpy",
    "arq",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "praxis-config",
    "praxis-ai-gateway",
    "silero-vad",
    "torch",
    "torchaudio",
    "librosa",
    "sounddevice",
    "onnxruntime",
    "faster-whisper"
]

[tool.setuptools]
packages = ["realtime_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_provider: mark a test as hitting a real AI provider"
]
