[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-ai-gateway"
version = "0.1.0"
description = "PRAXIS AI Gateway"
dependencies = [
    "praxis-config",
    "pydantic",
    "PyYAML",
    "httpx",
    "respx",
    "redis",
    "SQLAlchemy",
    "tiktoken",
    "sentence-transformers"
]

[tool.setuptools.packages.find]
include = ["praxis_ai_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_provider: mark a test as hitting a real AI provider"
]
