name: Supabase Keepalive

# The Supabase Free Tier pauses projects after 7 days of inactivity.
# We run this every 3 days to guarantee the project remains active, 
# preventing a "Connection Refused" failure on hackathon judging day.

on:
  schedule:
    # Run at 10:00 UTC every 3 days
    - cron: '0 10 */3 * *'
  workflow_dispatch: # Allow manual triggering for testing

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL or SUPABASE_ANON_KEY are missing."
            exit 1
          fi

          echo "Pinging Supabase REST API..."
          
          # We perform a lightweight GET on the skills table.
          # -s ensures silent curl, -f ensures curl fails (exit code >0) on HTTP errors.
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -f -X GET "$SUPABASE_URL/rest/v1/skills?limit=1" \
               -H "apikey: $SUPABASE_ANON_KEY" \
               -H "Authorization: Bearer $SUPABASE_ANON_KEY")
               
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Successfully pinged Supabase. Project is awake."
            exit 0
          else
            echo "Failed to ping Supabase. HTTP Status: $HTTP_STATUS"
            echo "The project might be paused or the credentials might be invalid."
            exit 1
          fi
