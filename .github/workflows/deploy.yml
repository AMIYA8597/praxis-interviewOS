name: Deploy to GCP

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Image tag (git SHA) to deploy. Leave empty to use the latest main commit SHA."
        required: false
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.tag }}
    steps:
    - uses: actions/checkout@v4

    - name: Resolve image tag
      id: resolve
      run: |
        TAG="${{ inputs.image_tag }}"
        if [ -z "$TAG" ]; then
          TAG="$(git rev-parse --short HEAD)"
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "Deploying image tag: $TAG"

    - name: Block production without staging
      if: inputs.environment == 'production'
      run: |
        echo "::warning::Production deploys require a staging certification."
        echo "Ensure staging has been smoke-tested with this image tag before proceeding."

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      REGION: asia-south1
      IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to GCP via Workload Identity Federation
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
        service_account: ${{ vars.GCP_DEPLOYER_SA }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ vars.GCP_PROJECT_ID }}

    - name: Verify images exist in Artifact Registry
      run: |
        REGISTRY="${REGION}-docker.pkg.dev/${{ vars.GCP_REGISTRY_PROJECT }}/praxis"
        for svc in praxis-api praxis-realtime praxis-worker; do
          echo "Checking ${REGISTRY}/${svc}:${IMAGE_TAG}..."
          gcloud artifacts docker images describe "${REGISTRY}/${svc}:${IMAGE_TAG}" \
            --project=${{ vars.GCP_REGISTRY_PROJECT }} \
            --format="value(image_summary.fully_qualified_digest)" \
            || { echo "::error::Image ${svc}:${IMAGE_TAG} not found in registry"; exit 1; }
        done

    - name: Deploy API
      run: |
        REGISTRY="${REGION}-docker.pkg.dev/${{ vars.GCP_REGISTRY_PROJECT }}/praxis"
        gcloud run deploy praxis-api \
          --image="${REGISTRY}/praxis-api:${IMAGE_TAG}" \
          --region=${REGION} \
          --project=${{ vars.GCP_PROJECT_ID }} \
          --quiet

    - name: Deploy Realtime
      run: |
        REGISTRY="${REGION}-docker.pkg.dev/${{ vars.GCP_REGISTRY_PROJECT }}/praxis"
        gcloud run deploy praxis-realtime \
          --image="${REGISTRY}/praxis-realtime:${IMAGE_TAG}" \
          --region=${REGION} \
          --project=${{ vars.GCP_PROJECT_ID }} \
          --quiet

    - name: Deploy Worker
      run: |
        REGISTRY="${REGION}-docker.pkg.dev/${{ vars.GCP_REGISTRY_PROJECT }}/praxis"
        gcloud run deploy praxis-worker \
          --image="${REGISTRY}/praxis-worker:${IMAGE_TAG}" \
          --region=${REGION} \
          --project=${{ vars.GCP_PROJECT_ID }} \
          --quiet

  smoke-test:
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    env:
      REGION: asia-south1
    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
        service_account: ${{ vars.GCP_DEPLOYER_SA }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ vars.GCP_PROJECT_ID }}

    - name: Get API URL and smoke test
      run: |
        API_URL=$(gcloud run services describe praxis-api \
          --region=${REGION} \
          --project=${{ vars.GCP_PROJECT_ID }} \
          --format="value(status.url)")

        echo "API URL: ${API_URL}"

        echo "Testing /health/live..."
        curl -fsS --max-time 10 "${API_URL}/health/live" || { echo "::error::Liveness probe failed"; exit 1; }

        echo "Testing /health/ready..."
        curl -fsS --max-time 15 "${API_URL}/health/ready" || { echo "::error::Readiness probe failed"; exit 1; }

        echo "Testing /api/v1/health..."
        curl -fsS --max-time 10 "${API_URL}/api/v1/health" || { echo "::error::API health check failed"; exit 1; }

        echo "Smoke test passed."
