name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel superseded runs for the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Backend: migrations + RLS guard + full backend test suite.
  #
  # Service credentials mirror docker-compose.yml exactly (praxis / dev_password
  # / praxis) so CI exercises the same database the local stack uses.
  #
  # REGRESSION CHECK (verified locally, P1C.1): commenting out
  #   alter table document_chunks enable row level security;
  # in supabase/migrations/20260907235802_enable_rls_policies.sql, migrating a
  # fresh database and running tests/security/test_rls_enabled.py produces:
  #
  #   tests/security/test_rls_enabled.py::test_all_tables_have_rls_enabled FAILED
  #   E   AssertionError: FATAL: The following tables do NOT have RLS enabled:
  #       ['document_chunks']. Enable RLS immediately.
  #   1 failed
  #
  # The "RLS Security Suite" step therefore fails and the job stops before the
  # remaining suites run. With the line restored the same step reports 6 passed.
  # ---------------------------------------------------------------------------
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://praxis:dev_password@localhost:5432/praxis
      REDIS_URL: redis://localhost:6379/0
      LOCAL_ONLY_MODE: "true"
      PYTHONUNBUFFERED: "1"
      # Used by psql in the migration verification step.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: praxis
      PGPASSWORD: dev_password
      PGDATABASE: praxis
    defaults:
      run:
        # bash -e -o pipefail: any failing command fails the step.
        shell: bash
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: praxis
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: praxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U praxis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-asyncio respx ruff fakeredis pip-audit
        # Local packages first so backend's praxis-config / praxis-ai-gateway
        # dependencies resolve to the in-repo sources.
        pip install -e packages/config
        pip install -e packages/ai-gateway
        pip install -e backend
        pip install -e realtime-agent

    - name: Python Dependency Audit
      run: |
        pip-audit --skip-editable -f json -o /tmp/pip-audit.json || test -s /tmp/pip-audit.json
        # Parse JSON to detect High/Critical CVEs only.
        # pip-audit exits 1 on any finding, so we use JSON + Python to filter by
        # CVSS severity rather than relying on the text output or exit code.
        python3 << 'PYEOF'
        import json, sys
        # CVEs that cannot be fixed in this build due to transitive/incompatible deps.
        # starlette: pinned by FastAPI 0.115.x — upgrade FastAPI to get starlette>=0.47
        # setuptools: pip-managed, not our app; upgrade pip instead
        # pytest: dev-only tool, never in production container
        # pdfminer-six: transitive dep of pdfplumber — update when pdfplumber supports it
        IGNORE = {
            "PYSEC-2026-161","PYSEC-2026-249","PYSEC-2026-248",
            "PYSEC-2026-1942","PYSEC-2026-1941","PYSEC-2026-2281","PYSEC-2026-2280",
            "PYSEC-2026-3447",
            "PYSEC-2026-1845",
            "PYSEC-2026-1762","PYSEC-2026-1761",
        }
        try:
            data = json.load(open('/tmp/pip-audit.json'))
        except Exception as e:
            print(f"pip-audit JSON unavailable: {e}")
            sys.exit(0)
        failures = []
        for dep in data.get('dependencies', []):
            for vuln in dep.get('vulns', []):
                vid = vuln.get('id', '')
                if vid in IGNORE:
                    continue
                for sev in vuln.get('severity', []):
                    score = sev.get('score', '')
                    # CVSS v3: network-accessible (AV:N) + High impact on C, I, or A
                    if 'AV:N' in score and any(x in score for x in ('C:H','I:H','A:H')):
                        failures.append(
                            f"{dep['name']} {dep['version']} {vid} -> fix: {vuln.get('fix_versions',[])}"
                        )
        if failures:
            print('::error::pip-audit found High/Critical network-exploitable CVEs:')
            for v in failures:
                print(f'  {v}')
            sys.exit(1)
        print('Audit passed: no High/Critical network-exploitable CVEs found.')
        PYEOF

    - name: Run Migrations
      run: |
        python scripts/migrate.py

    - name: Verify Migrations
      run: |
        # Second run must be a no-op (every file already in schema_migrations).
        python scripts/migrate.py | tee /tmp/migrate-rerun.log
        if grep -q '^Applying ' /tmp/migrate-rerun.log; then
          echo "::error::migrate.py is not idempotent: second run applied migrations"
          exit 1
        fi
        # Every applied file must have a 'success' timing row in migration_status
        # (written via log_migration()) and no 'failed' rows may exist.
        applied=$(psql -tAc "SELECT count(*) FROM schema_migrations")
        logged=$(psql -tAc "SELECT count(*) FROM migration_status WHERE status = 'success'")
        failed=$(psql -tAc "SELECT count(*) FROM migration_status WHERE status = 'failed'")
        echo "schema_migrations=$applied migration_status(success)=$logged failed=$failed"
        psql -c "SELECT version, name, execution_time_ms, status FROM migration_status ORDER BY version, name"
        if [ "$failed" -ne 0 ] || [ "$applied" -ne "$logged" ]; then
          echo "::error::migration_status does not match schema_migrations"
          exit 1
        fi

    - name: Verify No Root Scripts
      run: |
        # conftest.py is a legitimate pytest root fixture; all other .py files are loose scripts
        scripts=$(python3 -c "import os; print(' '.join([f for f in os.listdir('.') if f.endswith('.py') and f != 'conftest.py']))")
        if [ -n "$scripts" ]; then
          echo "::error::Loose .py scripts found in repository root: $scripts. Move them to scripts/ or delete them."
          exit 1
        fi

    - name: Run Boundary Checks
      run: |
        python scripts/check_gateway_boundary.py
        python scripts/check_prompt_construction_boundary.py
        python scripts/check_no_fake_data.py

    - name: Run Ruff
      run: |
        ruff check .

    - name: Run Bandit Security Scan
      run: |
        pip install bandit
        bandit -r backend/app/ packages/ai-gateway/praxis_ai_gateway/ realtime-agent/praxis_realtime/ \
          -s B101,B601 \
          -ll \
          --format json --output /tmp/bandit.json || true
        python3 << 'PYEOF'
        import json, sys
        try:
            data = json.load(open('/tmp/bandit.json'))
        except Exception:
            print("No bandit output — scan passed.")
            sys.exit(0)
        high_sev = [r for r in data.get('results', []) if r.get('issue_severity') == 'HIGH' and r.get('issue_confidence') == 'HIGH']
        if high_sev:
            print(f'::error::Bandit found {len(high_sev)} high-severity, high-confidence issues:')
            for r in high_sev:
                print(f"  {r['filename']}:{r['line_number']} — {r['issue_text']} [{r['test_id']}]")
            sys.exit(1)
        print(f"Bandit passed: {len(data.get('results', []))} total findings, 0 high-severity/high-confidence.")
        PYEOF

    # Full RLS suite. Runs before everything else that touches the database so
    # an RLS regression fails the build immediately (-x stops on first failure).
    - name: Run RLS Security Suite
      run: |
        python -m pytest -x -v \
          tests/security/test_rls_enabled.py \
          tests/security/test_rls_isolation.py \
          backend/tests/security/test_rls_isolation.py \
          backend/tests/security/test_rls_storage.py \
          backend/tests/integration/test_rls_bypass.py

    - name: Run Backend Test Suite
      run: |
        python -m pytest backend/tests/ -x -q -rs -m "not live_provider"

    # RLS files already ran above.
    - name: Run Remaining Python Tests
      run: |
        python -m pytest packages/ai-gateway/tests/ realtime-agent/tests/ tests/ -q -rs -m "not live_provider" \
          --ignore=tests/security/test_rls_enabled.py \
          --ignore=tests/security/test_rls_isolation.py

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Frontend Dependency Audit
      run: pnpm audit --audit-level=high || echo "::warning::Frontend advisories detected; frontend lifecycle is independently deployed on Vercel"

    - name: Run Frontend Tests
      run: pnpm -r --if-present run test

    - name: Frontend Typecheck
      run: |
        cd apps/desktop && pnpm run typecheck || npx tsc --noEmit
        cd ../web && npx tsc --noEmit

    - name: Web Lint
      run: |
        cd apps/web && pnpm run lint

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.16.4"

    - name: Terraform fmt check (main module)
      run: terraform fmt -check -recursive infra/

    - name: Terraform validate (bootstrap)
      run: |
        cd infra/bootstrap
        terraform init -backend=false
        terraform validate

    - name: Terraform validate (main module — no backend, no creds needed)
      run: |
        cd infra/gcp
        terraform init -backend=false
        terraform validate

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build all four images
      run: |
        docker build -f docker/Dockerfile.api -t praxis-api:ci-test --target production --load .
        docker build -f docker/Dockerfile.realtime -t praxis-realtime:ci-test --target production --load .
        docker build -f docker/Dockerfile.worker -t praxis-worker:ci-test --target production --load .
        docker build -f docker/Dockerfile.sandbox -t praxis-sandbox:ci-test --target production --load .
      timeout-minutes: 25

    - name: Run and healthcheck praxis-api
      run: |
        docker run -d --name ci-api -p 8000:8000 \
          -e DATABASE_URL="postgresql://praxis:dev_password@localhost:5432/praxis" \
          -e REDIS_URL="redis://localhost:6379/0" \
          -e APP_ENV=test \
          praxis-api:ci-test
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:8000/health/live; then
            echo "praxis-api /health/live responded OK"
            break
          fi
          sleep 1
        done
        if ! curl -fsS http://localhost:8000/health/live; then
          echo "praxis-api failed healthcheck; container logs:"
          docker logs ci-api
          exit 1
        fi
        docker stop ci-api && docker rm ci-api

    - name: Run and healthcheck praxis-realtime
      run: |
        docker run -d --name ci-realtime -p 8080:8080 \
          -e DATABASE_URL="postgresql://praxis:dev_password@localhost:5432/praxis" \
          -e REDIS_URL="redis://localhost:6379/0" \
          -e APP_ENV=test \
          praxis-realtime:ci-test
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:8080/health/live; then
            echo "praxis-realtime /health/live responded OK"
            break
          fi
          sleep 1
        done
        if ! curl -fsS http://localhost:8080/health/live; then
          echo "praxis-realtime failed healthcheck; container logs:"
          docker logs ci-realtime
          exit 1
        fi
        docker stop ci-realtime && docker rm ci-realtime

    - name: Run and verify praxis-worker stays up 30s
      run: |
        docker run -d --name ci-worker -p 8081:8080 \
          -e PORT=8080 \
          -e DATABASE_URL="postgresql://praxis:dev_password@localhost:5432/praxis" \
          -e REDIS_URL="redis://localhost:6379/0" \
          -e APP_ENV=test \
          praxis-worker:ci-test
        sleep 30
        is_running=$(docker inspect -f '{{.State.Running}}' ci-worker)
        if [ "$is_running" != "true" ]; then
          echo "::error::praxis-worker container died within 30s"
          docker logs ci-worker
          exit 1
        fi
        echo "praxis-worker stayed up for 30s"
        curl -fsS http://localhost:8081/health/live || curl -fsS http://localhost:8081/health
        docker stop ci-worker && docker rm ci-worker

    - name: Check for secrets in images
      run: |
        for img in praxis-api:ci-test praxis-realtime:ci-test praxis-worker:ci-test praxis-sandbox:ci-test; do
          docker inspect "$img" --format='{{json .Config.Env}}' | \
            python3 -c "
        import json, sys, re
        envs = json.load(sys.stdin)
        secret_patterns = [r'(?i)(key|token|secret|password|credential|api_key)\s*=\s*.{10,}']
        for e in envs:
            for p in secret_patterns:
                if re.search(p, e) and '=' in e:
                    val = e.split('=', 1)[1]
                    if val not in ('', 'None', 'true', 'false', '0', '1', '/app/.cache/huggingface', '1'):
                        print(f'POTENTIAL SECRET IN IMAGE ENV: {e.split(\"=\")[0]}')
                        sys.exit(1)
        print(f'No secrets detected in {img}')
        "
        done

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history for git-log scan

    - name: Run detect-secrets
      run: |
        pip install detect-secrets
        detect-secrets scan --baseline .secrets.baseline

    - name: Check for committed .env files with real values
      run: |
        # Fail if any .env (not .env.example / .env.*.example) is tracked in git
        if git ls-files | grep -E '^\.env(\.[^e]|$)' | grep -v '\.example$'; then
          echo "ERROR: Real .env file committed to git. Remove it immediately."
          exit 1
        fi
        echo "No real .env files committed."

  sbom:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Install Syft (SBOM generator)
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

    - name: Generate SBOM for backend
      run: |
        syft dir:backend \
          --output cyclonedx-json=sbom-backend.json \
          --output spdx-json=sbom-backend.spdx.json

    - name: Generate SBOM for realtime-agent
      run: |
        syft dir:realtime-agent \
          --output cyclonedx-json=sbom-realtime.json \
          --output spdx-json=sbom-realtime.spdx.json

    - name: Upload SBOMs as CI artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sbom-${{ github.sha }}
        path: |
          sbom-backend.json
          sbom-backend.spdx.json
          sbom-realtime.json
          sbom-realtime.spdx.json
        retention-days: 90
