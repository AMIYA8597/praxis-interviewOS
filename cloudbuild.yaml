# Cloud Build — Production CI/CD pipeline
# Triggered on push to main branch.
# Builds all three service images, pushes to Artifact Registry,
# deploys to staging, runs smoke tests, tags for production.

substitutions:
  _REGION: us-central1
  _REGISTRY: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/praxis
  _IMAGE_TAG: ${SHORT_SHA}
  _STAGING_API_URL: ""  # set by Cloud Build trigger or pass via --substitutions

steps:
  # ── Build images in parallel ───────────────────────────────────────────────
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/Dockerfile.api
      - -t
      - ${_REGISTRY}/praxis-api:${_IMAGE_TAG}
      - --target
      - production
      - --cache-from
      - ${_REGISTRY}/praxis-api:latest
      - .
    waitFor: ['-']

  - id: build-realtime
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/Dockerfile.realtime
      - -t
      - ${_REGISTRY}/praxis-realtime:${_IMAGE_TAG}
      - --target
      - production
      - --cache-from
      - ${_REGISTRY}/praxis-realtime:latest
      - .
    waitFor: ['-']

  - id: build-worker
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/Dockerfile.worker
      - -t
      - ${_REGISTRY}/praxis-worker:${_IMAGE_TAG}
      - --target
      - production
      - --cache-from
      - ${_REGISTRY}/praxis-worker:latest
      - .
    waitFor: ['-']

  # ── Push images ────────────────────────────────────────────────────────────
  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: [push, ${_REGISTRY}/praxis-api:${_IMAGE_TAG}]
    waitFor: [build-api]

  - id: push-realtime
    name: gcr.io/cloud-builders/docker
    args: [push, ${_REGISTRY}/praxis-realtime:${_IMAGE_TAG}]
    waitFor: [build-realtime]

  - id: push-worker
    name: gcr.io/cloud-builders/docker
    args: [push, ${_REGISTRY}/praxis-worker:${_IMAGE_TAG}]
    waitFor: [build-worker]

  # ── Deploy to staging ──────────────────────────────────────────────────────
  - id: deploy-staging-api
    name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - praxis-api
      - --image=${_REGISTRY}/praxis-api:${_IMAGE_TAG}
      - --region=${_REGION}
      - --project=praxis-staging
      - --quiet
    waitFor: [push-api]

  - id: deploy-staging-realtime
    name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - praxis-realtime
      - --image=${_REGISTRY}/praxis-realtime:${_IMAGE_TAG}
      - --region=${_REGION}
      - --project=praxis-staging
      - --quiet
    waitFor: [push-realtime]

  - id: deploy-staging-worker
    name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - praxis-worker
      - --image=${_REGISTRY}/praxis-worker:${_IMAGE_TAG}
      - --region=${_REGION}
      - --project=praxis-staging
      - --quiet
    waitFor: [push-worker]

  # ── Staging smoke test ─────────────────────────────────────────────────────
  - id: staging-smoke-test
    name: python:3.11-slim
    entrypoint: bash
    env:
      - STAGING_API_URL=${_STAGING_API_URL}
    args:
      - -c
      - |
        pip install -q httpx
        python - <<'EOF'
        import httpx, sys, os
        base = os.environ.get("STAGING_API_URL", "")
        assert base, "STAGING_API_URL not set — pass via Cloud Build trigger substitution _STAGING_API_URL"
        r = httpx.get(f"{base}/health", timeout=30)
        assert r.status_code == 200, f"Health check failed: {r.status_code}"
        print(f"Staging health check passed: {r.json()}")
        EOF
    waitFor: [deploy-staging-api]

  # ── Tag :latest ────────────────────────────────────────────────────────────
  - id: tag-latest
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker tag ${_REGISTRY}/praxis-api:${_IMAGE_TAG} ${_REGISTRY}/praxis-api:latest
        docker tag ${_REGISTRY}/praxis-realtime:${_IMAGE_TAG} ${_REGISTRY}/praxis-realtime:latest
        docker tag ${_REGISTRY}/praxis-worker:${_IMAGE_TAG} ${_REGISTRY}/praxis-worker:latest
        docker push ${_REGISTRY}/praxis-api:latest
        docker push ${_REGISTRY}/praxis-realtime:latest
        docker push ${_REGISTRY}/praxis-worker:latest
    waitFor: [staging-smoke-test]

images:
  - ${_REGISTRY}/praxis-api:${_IMAGE_TAG}
  - ${_REGISTRY}/praxis-realtime:${_IMAGE_TAG}
  - ${_REGISTRY}/praxis-worker:${_IMAGE_TAG}

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true

timeout: 3600s
