[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F821"]
ignore = ["E902"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_provider: mark a test as hitting a real AI provider"
]

# ── uv workspace ──────────────────────────────────────────────────────────────
# Run `uv sync` from the repository root to install all packages reproducibly.
# The generated uv.lock file pins every transitive dependency.
[tool.uv]
package = false

[tool.uv.sources]
praxis-config = { path = "packages/config", editable = true }
praxis-ai-gateway = { path = "packages/ai-gateway", editable = true }
praxis-backend = { path = "backend", editable = true }
praxis-realtime-agent = { path = "realtime-agent", editable = true }
