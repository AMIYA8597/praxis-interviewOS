      cost_per_1k_output: 0.00060
    - provider: "ollama"
      model: "llama3.1:8b-instruct-q4_K_M"
      max_latency_ms: 30000

  # Speech-to-text is routed by praxis_ai_gateway.transcription.router, not
  # by GatewayRouter; "local" there means faster-whisper.
  stt_stream:
    - provider: "local"
      model: "faster-whisper-small.en"
