  coding_evaluation:
    - provider: "groq"
      model: "llama-3.3-70b-versatile"
      max_latency_ms: 10000
    - provider: "gemini"
      model: "gemini-3.1-flash-lite"
      max_latency_ms: 10000
    - provider: "openai"
      model: "gpt-4o"
      max_latency_ms: 12000
      cost_per_1k_input: 0.00500
      cost_per_1k_output: 0.01500
    - provider: "ollama"
