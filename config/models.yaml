# Provider keys MUST match the `name` attribute of the registered provider
# instances (see praxis_ai_gateway/providers/*.py): ollama, groq, openai,
# anthropic, gemini, deepseek, xai. Candidates are tried in order; the
# gateway falls back to the next one on failure / open circuit breaker.
# Cloud providers are placed first because no Ollama runs in container/cloud environments.
aliases:
  fast_classify:
    - provider: "groq"
      model: "llama-3.1-8b-instant"
      max_latency_ms: 1000
    - provider: "gemini"
      model: "gemini-3.1-flash-lite"
      max_latency_ms: 1500
    - provider: "openai"
      model: "gpt-4o-mini"
      max_latency_ms: 2000
      cost_per_1k_input: 0.00015
      cost_per_1k_output: 0.00060
    - provider: "ollama"
      model: "llama3.1:8b-instruct-q4_K_M"
      max_latency_ms: 500

  # General structured extraction / drafting (resume + JD parsing, outreach,
  # study material). Cloud-first in server environments.
  reasoning:
    - provider: "groq"
      model: "llama-3.3-70b-versatile"
      max_latency_ms: 10000
    - provider: "gemini"
      model: "gemini-3.1-flash-lite"
      max_latency_ms: 10000
    - provider: "openai"
      model: "gpt-4o-mini"
      max_latency_ms: 10000
      cost_per_1k_input: 0.00015
      cost_per_1k_output: 0.00060
    - provider: "ollama"
      model: "llama3.1:8b-instruct-q4_K_M"
      max_latency_ms: 30000

  # Deep reasoning and multi-dimensional scoring (debrief, system design, coding)
  deep_reasoning:
    - provider: "groq"
      model: "llama-3.3-70b-versatile"
      max_latency_ms: 10000
    - provider: "gemini"
      model: "gemini-3.1-flash-lite"
      max_latency_ms: 10000
    - provider: "openai"
      model: "gpt-4o"
      max_latency_ms: 10000
      cost_per_1k_input: 0.00500
      cost_per_1k_output: 0.01500
    - provider: "anthropic"
      model: "claude-3-5-sonnet-20241022"
      max_latency_ms: 10000
      cost_per_1k_input: 0.00300
      cost_per_1k_output: 0.01500
    - provider: "ollama"
      model: "llama3.1:8b-instruct-q4_K_M"
      max_latency_ms: 30000

  # Specialized Phase 2 AI/ML Tasks
  question_generation:
    - provider: "groq"
      model: "llama-3.3-70b-versatile"
      max_latency_ms: 5000
    - provider: "gemini"
      model: "gemini-3.1-flash-lite"
      max_latency_ms: 5000
    - provider: "openai"
      model: "gpt-4o-mini"
      max_latency_ms: 5000
      cost_per_1k_input: 0.00015
      cost_per_1k_output: 0.00060
    - provider: "ollama"
      model: "llama3.1:8b-instruct-q4_K_M"
      max_latency_ms: 25000

  answer_evaluation:
    - provider: "groq"
      model: "llama-3.3-70b-versatile"
      max_latency_ms: 10000
    - provider: "gemini"
      model: "gemini-3.1-flash-lite"
      max_latency_ms: 10000
    - provider: "openai"
      model: "gpt-4o"
      max_latency_ms: 10000
      cost_per_1k_input: 0.00500
      cost_per_1k_output: 0.01500
    - provider: "anthropic"
      model: "claude-3-5-sonnet-20241022"
      max_latency_ms: 10000
      cost_per_1k_input: 0.00300
      cost_per_1k_output: 0.01500
    - provider: "ollama"
      model: "llama3.1:8b-instruct-q4_K_M"
      max_latency_ms: 30000

  claim_extraction:
    - provider: "groq"
      model: "llama-3.1-8b-instant"
      max_latency_ms: 2000
    - provider: "gemini"
      model: "gemini-3.1-flash-lite"
      max_latency_ms: 2500
    - provider: "openai"
      model: "gpt-4o-mini"
      max_latency_ms: 3000
      cost_per_1k_input: 0.00015
      cost_per_1k_output: 0.00060
    - provider: "ollama"
      model: "llama3.1:8b-instruct-q4_K_M"
      max_latency_ms: 15000

  claim_grounding:
