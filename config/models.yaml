# Provider keys MUST match the `name` attribute of the registered provider
# instances (see praxis_ai_gateway/providers/*.py): ollama, groq, openai,
# anthropic, gemini, deepseek, xai. Candidates are tried in order; the
# gateway falls back to the next one on failure / open circuit breaker.
aliases:
  fast_classify:
    - provider: "ollama"
      model: "llama3.1:8b-instruct-q4_K_M"
      max_latency_ms: 500
    - provider: "groq"
      model: "llama-3.1-8b-instant"
      max_latency_ms: 1000
    - provider: "openai"
      model: "gpt-4o-mini"
      max_latency_ms: 2000
      cost_per_1k_input: 0.00015
      cost_per_1k_output: 0.00060

  # General structured extraction / drafting (resume + JD parsing, outreach,
  # study material). Free/local first.
  reasoning:
    - provider: "ollama"
      model: "llama3.1:8b-instruct-q4_K_M"
      max_latency_ms: 30000
    - provider: "groq"
      model: "llama-3.3-70b-versatile"
      max_latency_ms: 10000
    - provider: "openai"
      model: "gpt-4o-mini"
      max_latency_ms: 10000
      cost_per_1k_input: 0.00015
      cost_per_1k_output: 0.00060

  deep_reasoning:
    - provider: "openai"
      model: "gpt-4o"
      max_latency_ms: 10000
      cost_per_1k_input: 0.00500
      cost_per_1k_output: 0.01500
    - provider: "anthropic"
      model: "claude-3-5-sonnet-20240620"
      max_latency_ms: 10000
      cost_per_1k_input: 0.00300
      cost_per_1k_output: 0.01500
    - provider: "groq"
      model: "llama-3.3-70b-versatile"
      max_latency_ms: 10000
    - provider: "ollama"
      model: "llama3.1:8b-instruct-q4_K_M"
      max_latency_ms: 30000

  # Speech-to-text is routed by praxis_ai_gateway.transcription.router, not
  # by GatewayRouter; "local" there means faster-whisper.
  stt_stream:
    - provider: "local"
      model: "faster-whisper-small.en"
