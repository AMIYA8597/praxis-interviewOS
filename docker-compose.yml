services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: praxis
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: praxis
    ports:
      - "5432:5432"
    volumes:
      - praxis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - praxis_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  worker:
    build: 
      context: ./backend
    command: python -m arq backend.worker_settings.WorkerSettings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://praxis:dev_password@postgres:5432/praxis
      REDIS_URL: redis://redis:6379/0

volumes:
  praxis_pgdata:
  praxis_redisdata:
