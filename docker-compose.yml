# Local development stack.
# Exercises the service boundaries: Postgres + pgvector, Redis, and application services.
#
# Usage:
#   docker compose up -d postgres redis
#
# Bring up the full stack:
#   docker compose up -d

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: praxis
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: praxis
    ports:
      - "5432:5432"
    volumes:
      - praxis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.1-alpine
    ports:
      - "6379:6379"
    volumes:
      - praxis_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  sandbox:
    build:
      context: .
      dockerfile: docker/Dockerfile.sandbox
      target: production
    ports:
      - "8001:8001"
    # Zero secrets passed to sandbox
    environment:
      PORT: "8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: production
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      SANDBOX_SERVICE_URL: "http://sandbox:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox:
        condition: service_healthy

  realtime:
    build:
      context: .
      dockerfile: docker/Dockerfile.realtime
      target: production
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      target: production
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  praxis_pgdata:
  praxis_redisdata:
