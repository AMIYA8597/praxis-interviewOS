# Local development stack.
# Does NOT replicate the full GCP production topology, but exercises the same
# service boundaries: Postgres + pgvector, Redis, and the application services.
#
# Usage:
#   docker compose up -d postgres redis
#   # then run backend/realtime locally with `uvicorn`
#
# Or bring up the full stack:
#   docker compose up -d

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: praxis
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: praxis
    ports:
      - "5432:5432"
    volumes:
      - praxis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.1-alpine
    ports:
      - "6379:6379"
    volumes:
      - praxis_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: production
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      target: production
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  praxis_pgdata:
  praxis_redisdata:
