substitutions:
  _REGISTRY: asia-south1-docker.pkg.dev/tradebit-396406/praxis
  _IMAGE_TAG: e49b460

steps:
  # ── Build API image ────────────────────────────────────────────────────────
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/Dockerfile.api
      - -t
      - ${_REGISTRY}/praxis-api:${_IMAGE_TAG}
      - --target
      - production
      - .

  # ── Build Realtime image ───────────────────────────────────────────────────
  - id: build-realtime
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/Dockerfile.realtime
      - -t
      - ${_REGISTRY}/praxis-realtime:${_IMAGE_TAG}
      - --target
      - production
      - .

  # ── Build Worker image ─────────────────────────────────────────────────────
  - id: build-worker
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/Dockerfile.worker
      - -t
      - ${_REGISTRY}/praxis-worker:${_IMAGE_TAG}
      - --target
      - production
      - .

  # ── Push SHA-tagged images ─────────────────────────────────────────────────
  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGISTRY}/praxis-api:${_IMAGE_TAG}
    waitFor: [build-api]

  - id: push-realtime
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGISTRY}/praxis-realtime:${_IMAGE_TAG}
    waitFor: [build-realtime]

  - id: push-worker
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGISTRY}/praxis-worker:${_IMAGE_TAG}
    waitFor: [build-worker]

  # ── Capture immutable image digests ───────────────────────────────────────
  - id: capture-digests
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        api_d=$$(gcloud artifacts docker images describe ${_REGISTRY}/praxis-api:${_IMAGE_TAG} --format='value(image_summary.fully_qualified_digest)')
        rt_d=$$(gcloud artifacts docker images describe ${_REGISTRY}/praxis-realtime:${_IMAGE_TAG} --format='value(image_summary.fully_qualified_digest)')
        wrk_d=$$(gcloud artifacts docker images describe ${_REGISTRY}/praxis-worker:${_IMAGE_TAG} --format='value(image_summary.fully_qualified_digest)')

        echo "=================================================="
        echo "IMMUTABLE RELEASE DIGESTS CAPTURED"
        echo "=================================================="
        echo "API_IMAGE=${_REGISTRY}/praxis-api:${_IMAGE_TAG}"
        echo "API_DIGEST=$$api_d"
        echo "REALTIME_IMAGE=${_REGISTRY}/praxis-realtime:${_IMAGE_TAG}"
        echo "REALTIME_DIGEST=$$rt_d"
        echo "WORKER_IMAGE=${_REGISTRY}/praxis-worker:${_IMAGE_TAG}"
        echo "WORKER_DIGEST=$$wrk_d"
        echo "=================================================="
    waitFor: [push-api, push-realtime, push-worker]

images:
  - ${_REGISTRY}/praxis-api:${_IMAGE_TAG}
  - ${_REGISTRY}/praxis-realtime:${_IMAGE_TAG}
  - ${_REGISTRY}/praxis-worker:${_IMAGE_TAG}

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

timeout: 3600s
